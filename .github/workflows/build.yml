name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v7
        with:
          name: TwerkToGrow-26.3
          path: build/libs/*.jar
